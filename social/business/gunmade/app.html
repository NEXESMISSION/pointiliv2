<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gunmade</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<!-- الخطوط ما يوقّفوش الصفحة -->
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
<style>
:root{
  --bg:#F7F6FB; --sheet:#FFF; --ink:#16131F; --body:#514C63; --muted:#8B85A0;
  --line:#E8E4F2; --soft:#F2EFFA; --hover:#FAF9FE;
  --brand:#6535E0; --brand-soft:#EFE9FF;
  --hot:#C2410C; --hot-soft:#FFF1E8;
  --warm:#8A6508; --warm-soft:#FDF6E3;
  --good:#15803D; --good-soft:#E8F6ED;
  --ar:"IBM Plex Sans Arabic",system-ui,sans-serif;
  --lat:Inter,system-ui,sans-serif;
  --rail:196px; --panel:430px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--body);font:13px/1.55 var(--ar);-webkit-font-smoothing:antialiased;overflow:hidden}
[hidden]{display:none!important}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.lat{font-family:var(--lat)}
bdi{unicode-bidi:isolate}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#DCD7EA;border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

/* ── الهيكل: بار فوق، ريل، ليستة، وبانّو ─────────────────────── */
.app{display:grid;grid-template-rows:auto 1fr;height:100%}
.top{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--sheet);border-bottom:1px solid var(--line)}
.brand{font:600 13.5px var(--lat);color:var(--ink);letter-spacing:-.01em;padding-inline-end:4px}
.find{flex:1;max-width:420px;position:relative}
.find input{width:100%;background:var(--bg);border:1px solid transparent;border-radius:8px;padding:7px 30px 7px 11px;font-size:13px}
.find input:focus{outline:0;border-color:var(--brand);background:var(--sheet)}
.find span{position:absolute;inset-inline-end:10px;top:6px;color:var(--muted);font-size:12px}
.b{cursor:pointer;border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:7px 11px;
   font-weight:600;font-size:12.5px;color:var(--body);white-space:nowrap}
.b:hover{border-color:var(--brand);color:var(--ink)}
.b.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.b.pri:hover{filter:brightness(1.08);color:#fff}
.b.sm{padding:5px 9px;font-size:11.5px}
.b.icon{padding:7px 9px}
.spacer{flex:1}

.main{display:grid;grid-template-columns:var(--rail) 1fr 0;min-height:0;transition:grid-template-columns .16s}
.main.open{grid-template-columns:var(--rail) 1fr var(--panel)}

/* ── الريل ──────────────────────────────────────────────────── */
.rail{border-inline-start:1px solid var(--line);background:var(--sheet);overflow:auto;padding:10px 8px 24px}
.rail h4{font-size:10.5px;font-weight:700;color:var(--muted);margin:14px 6px 5px}
.rail h4:first-child{margin-top:2px}
.r{display:flex;gap:8px;align-items:center;width:100%;border:0;background:transparent;border-radius:8px;
   padding:6px 9px;cursor:pointer;color:var(--body);font-size:12.5px;font-weight:600;text-align:start}
.r:hover{background:var(--hover)}
.r[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand)}
.r .n{margin-inline-start:auto;font:600 11px var(--lat);color:var(--muted)}
.r[aria-pressed="true"] .n{color:var(--brand)}
.r .sw{width:8px;height:8px;border-radius:50%;flex:none}

/* ── الليستة ────────────────────────────────────────────────── */
.list{overflow:auto;padding:0 0 30px}
.gh{position:sticky;top:0;z-index:5;background:var(--bg);padding:11px 14px 5px;display:flex;gap:8px;align-items:center}
.gh b{font-size:11.5px;font-weight:700;color:var(--ink)}
.gh i{font-style:normal;font:600 10.5px var(--lat);color:var(--muted);background:var(--soft);border-radius:999px;padding:0 6px}
.gh em{font-style:normal;font-size:11px;color:var(--muted)}

.row{display:grid;grid-template-columns:32px minmax(130px,1.1fr) 84px minmax(140px,1.5fr) 100px 108px 10px;
     gap:10px;align-items:center;width:100%;text-align:start;border:0;border-bottom:1px solid var(--line);
     background:var(--sheet);padding:7px 14px;cursor:pointer;min-height:46px}
.row:hover{background:var(--hover)}
.row.on{background:var(--brand-soft)}
.row .nm{display:block;font-weight:600;color:var(--ink);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .int{display:block;font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .stp{font-size:12px;color:var(--body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .stp.no{color:#B8B2C8}
.row .due{font:600 11px var(--lat);color:var(--muted);white-space:nowrap}
.row .due.now{color:var(--hot)}
.row .ph{font:500 11.5px var(--lat);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:1000px){
  .row{grid-template-columns:32px 1fr 84px 10px}
  .row .stp,.row .due,.row .ph{display:none}
}

.av{width:32px;height:32px;border-radius:9px;object-fit:cover;background:var(--soft);display:grid;place-items:center;
    font:600 12.5px var(--lat);color:#fff;overflow:hidden;flex:none}
.av.xl{width:64px;height:64px;border-radius:14px;font-size:24px}
.pill{border-radius:6px;padding:2px 7px;font-size:11px;font-weight:600;white-space:nowrap;display:inline-block;
      overflow:hidden;text-overflow:ellipsis;max-width:100%}
.st-lead{background:#F0EEF6;color:#78718C}
.st-qualified{background:var(--brand-soft);color:var(--brand)}
.st-interested{background:var(--warm-soft);color:var(--warm)}
.st-demo{background:var(--hot-soft);color:var(--hot)}
.st-client{background:var(--good-soft);color:var(--good)}
.st-later{background:var(--soft);color:var(--muted)}
.st-lost{background:#F4F3F7;color:#A8A2B8}
.dot{width:8px;height:8px;border-radius:50%}
.h-hot{background:var(--hot)} .h-warm{background:#E0B341} .h-cold{background:#D8D3E4}
.none{color:var(--muted);text-align:center;padding:46px 12px;font-size:13px}

/* ── البانّو ────────────────────────────────────────────────── */
.panel{border-inline-end:1px solid var(--line);background:var(--sheet);overflow:auto;min-width:0}
.main:not(.open) .panel{display:none}
@media(max-width:820px){
  .main.open{grid-template-columns:0 0 1fr}
  .rail{display:none}
}
.ph-head{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--line);
         position:sticky;top:0;background:var(--sheet);z-index:4}
.ph-head .grow{flex:1;min-width:0;display:grid;gap:3px}
.avwrap{position:relative;flex:none;cursor:pointer}
.avwrap .tag{position:absolute;inset:0;border-radius:14px;display:grid;place-items:center;text-align:center;
             background:rgba(22,19,31,.62);color:#fff;font-size:10px;font-weight:600;opacity:0;line-height:1.3}
.avwrap:hover .tag,.avwrap.armed .tag{opacity:1}
.avwrap.armed .tag{background:var(--brand)}

.t{border:0;background:transparent;padding:2px 3px;border-radius:6px;width:100%;min-width:0}
.t:hover{background:var(--hover)}
.t:focus{outline:0;background:var(--soft)}
.t.name{font:700 16px var(--ar);color:var(--ink)}
.t.sub{font-size:12.5px;color:var(--body)}

section{border-bottom:1px solid var(--line);padding:11px 14px;display:grid;gap:8px}
section > h5{margin:0;font-size:10.5px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:7px}
section > h5 .add{margin-inline-start:auto}

.kv{display:grid;grid-template-columns:62px 1fr;gap:4px 8px;align-items:center}
.kv > span{font-size:11px;color:var(--muted)}
.kv .t{font-size:12.5px}
.sel{border:1px solid var(--line);background:var(--sheet);border-radius:7px;padding:5px 7px;font-size:12px;width:100%}
.sel:focus{outline:0;border-color:var(--brand)}
.trio{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}

/* الخطوات: سطر واحد، بلا صندوق */
.step{display:grid;grid-template-columns:16px 1fr auto 18px;gap:8px;align-items:center;padding:3px 0}
.step input[type=checkbox]{width:15px;height:15px;accent-color:var(--brand);cursor:pointer}
.step .t{font-size:12.5px}
.step.done .t{text-decoration:line-through;color:var(--muted)}
.step .d{border:0;background:transparent;font:600 11px var(--lat);color:var(--muted);border-radius:6px;padding:2px 4px;width:104px}
.step .d:hover{background:var(--hover)}
.step .x{border:0;background:transparent;color:#C8C2D6;cursor:pointer;font-size:13px;padding:0;line-height:1}
.step .x:hover{color:var(--hot)}
.step.now .t{font-weight:600;color:var(--ink)}
.nowbar{border-inline-start:2px solid var(--brand);padding-inline-start:7px}

/* أسئلة */
.q{display:grid;gap:3px;padding:6px 0;border-bottom:1px dashed var(--line)}
.q:last-child{border-bottom:0}
.q .hd{display:grid;grid-template-columns:1fr 18px;gap:6px;align-items:center}
.q .t{font-size:12.5px;font-weight:600;color:var(--ink)}
.q textarea{border:0;background:transparent;resize:vertical;min-height:19px;font-size:12.5px;padding:2px 3px;border-radius:6px;color:var(--body)}
.q textarea:hover{background:var(--hover)}
.q textarea:focus{outline:0;background:var(--soft)}
.q.open .t{color:var(--hot)}
.q .x{border:0;background:transparent;color:#C8C2D6;cursor:pointer;font-size:13px;padding:0}
.q .x:hover{color:var(--hot)}

/* الووركفلو: بيلات صغار */
.flow{display:flex;flex-wrap:wrap;gap:5px}
.flow button{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:4px 10px;
             font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer}
.flow button:hover{border-color:var(--brand);color:var(--brand)}
.flow button.on{background:var(--good-soft);border-color:#C6E4D0;color:var(--good)}
.bar{height:4px;border-radius:4px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);border-radius:4px}

/* تصاور */
.shots{display:flex;gap:6px;flex-wrap:wrap}
.shots .s{width:70px;height:56px;border-radius:9px;overflow:hidden;border:1px solid var(--line);position:relative;cursor:zoom-in}
.shots .s img{width:100%;height:100%;object-fit:cover;display:block}
.shots .s button{position:absolute;top:2px;inset-inline-end:2px;border:0;border-radius:6px;width:19px;height:19px;
                 background:rgba(22,19,31,.6);color:#fff;cursor:pointer;font-size:11px;line-height:1;display:none;padding:0}
.shots .s:hover button{display:block}
.shots .plus{width:70px;height:56px;border-radius:9px;border:1.5px dashed var(--line);display:grid;place-items:center;
             color:var(--muted);font-size:10.5px;cursor:pointer;text-align:center;line-height:1.25}
.shots .plus:hover,.shots .plus.armed{border-color:var(--brand);color:var(--brand);background:var(--brand-soft);border-style:solid}

textarea.notes{border:1px solid var(--line);border-radius:9px;background:var(--bg);padding:8px 10px;resize:vertical;
               min-height:74px;font-size:12.5px;line-height:1.7;width:100%}
textarea.notes:focus{outline:0;border-color:var(--brand);background:var(--sheet)}

.pfoot{display:flex;gap:8px;align-items:center;padding:10px 14px 24px}
.pfoot small{color:var(--muted);font-size:11px;margin-inline-end:auto}
.zoom{position:fixed;inset:0;background:rgba(22,19,31,.88);z-index:90;display:grid;place-items:center;padding:26px;cursor:zoom-out}
.zoom img{max-width:100%;max-height:100%;border-radius:10px}
.toast{position:fixed;inset-block-end:16px;inset-inline-start:50%;transform:translateX(50%);z-index:95;
       background:var(--ink);color:#fff;border-radius:9px;padding:8px 15px;font-size:12.5px;font-weight:600}
</style>
</head>
<body>
<div class="app">

  <div class="top">
    <span class="brand">Gunmade</span>
    <span class="find"><input id="q" placeholder="لوّج…" /><span>⌕</span></span>
    <button class="b pri" id="add">+ كلينت</button>
    <span class="spacer"></span>
    <button class="b sm" id="exp">تصدير</button>
    <button class="b sm" id="imp">استيراد</button>
    <input type="file" id="file" accept="application/json" hidden />
  </div>

  <div class="main" id="main">
    <div class="rail" id="rail"></div>
    <div class="list" id="list"></div>
    <div class="panel" id="panel"></div>
  </div>

</div>

<script src="seed.js" onerror="window.SEED=null"></script>
<script>
"use strict";

/* ══ التخزين: IndexedDB، على خاطر التصاور الملزوقة تولّي كبيرة ══════ */
const DB="gunmade", OLD_DB="pointili-crm", STORE="clients";
let db;
const idb={
  open:()=>new Promise((ok,no)=>{const r=indexedDB.open(DB,1);
    r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:"id"})};
    r.onsuccess=()=>{db=r.result;ok()};r.onerror=()=>no(r.error)}),
  all:()=>new Promise((ok,no)=>{const r=db.transaction(STORE).objectStore(STORE).getAll();
    r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}),
  put:v=>new Promise((ok,no)=>{const r=db.transaction(STORE,"readwrite").objectStore(STORE).put(v);
    r.onsuccess=()=>ok();r.onerror=()=>no(r.error)}),
  del:id=>new Promise((ok,no)=>{const r=db.transaction(STORE,"readwrite").objectStore(STORE).delete(id);
    r.onsuccess=()=>ok();r.onerror=()=>no(r.error)}),
};

/* ══ الكلمات ═══════════════════════════════════════════════════════ */
const STAGES=[["lead","جديد"],["qualified","نعرفوه"],["interested","مهتم"],["demo","ديمو"],
              ["client","كلينت"],["later","بعد شوية"],["lost","مشى"]];
const ST=Object.fromEntries(STAGES);
const HEATS=[["hot","سخون"],["warm","دافي"],["cold","بارد"]];
const FLOW=[["talk","حكينا"],["type","اللوكال"],["zone","الزون"],["phone","النمرة"],["slot","موعد"],
            ["demo","ديمو"],["paid","خلّص"],["install","ركّبنا"],["d3","نهار 3"],["d7","نهار 7"],
            ["gift","أول كادو"],["renew","جدّد"]];
const TINTS=["#6535E0","#C2410C","#15803D","#0E7490","#9D174D","#8A6508"];

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>new Date().toISOString().slice(0,10);
const toast=m=>{const e=document.createElement("div");e.className="toast";e.textContent=m;
  document.body.appendChild(e);setTimeout(()=>e.remove(),1700)};

/* ══ الحالة ════════════════════════════════════════════════════════ */
let rows=[], open=null, armed=false;
const F={q:"",stage:null,group:null,heat:null,due:false,ask:false};
const groups=()=>[...new Set(rows.map(r=>r.group).filter(Boolean))].sort();
const nextStep=r=>(r.steps||[]).find(s=>!s.done)||null;
const openQ=r=>(r.qa||[]).filter(x=>x.q&&!x.a).length;
const doneN=r=>FLOW.filter(([k])=>r.flow?.[k]).length;
const blank=()=>({id:uid(),name:"",img:null,shots:[],interest:"",phone:"",zone:"",channel:"",
  stage:"lead",group:"",heat:"warm",qa:[],steps:[],details:"",flow:{},created:today(),updated:today()});

async function save(r){r.updated=today();await idb.put(r);
  const i=rows.findIndex(x=>x.id===r.id); i<0?rows.push(r):rows[i]=r;}

/* ══ التصاور ═══════════════════════════════════════════════════════ */
const shrink=(file,max,q)=>new Promise(ok=>{
  const fr=new FileReader();
  fr.onload=()=>{const im=new Image();
    im.onload=()=>{const r=Math.min(1,max/Math.max(im.width,im.height));
      const c=document.createElement("canvas");c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);
      c.getContext("2d").drawImage(im,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",q))};
    im.onerror=()=>ok(null);im.src=fr.result};
  fr.onerror=()=>ok(null);fr.readAsDataURL(file);
});

document.addEventListener("paste",async e=>{
  if(!open) return;
  const it=[...(e.clipboardData?.items||[])].find(i=>i.type.startsWith("image/"));
  if(!it) return;
  e.preventDefault();
  const f=it.getAsFile(); if(!f) return;
  if(armed==="img"){ open.img=await shrink(f,300,.86); armed=false; toast("تبدّلت الصورة"); }
  else{ const d=await shrink(f,1400,.82);
        if(d){ (open.shots||(open.shots=[])).push({id:uid(),data:d,at:today()}); toast("تزادت تصويرة"); }
        armed=false; }
  await save(open); drawPanel(); drawList();
});

/* ══ الليستة ═══════════════════════════════════════════════════════ */
function av(r,cls){
  if(r.img) return `<img class="av ${cls||""}" src="${r.img}" alt="" />`;
  const ch=[...(r.name||"؟")].find(c=>/\S/.test(c))||"؟";
  return `<span class="av ${cls||""}" style="background:${TINTS[[...r.id].reduce((a,c)=>a+c.charCodeAt(0),0)%TINTS.length]}" dir="auto">${esc(ch)}</span>`;
}
function match(r){
  if(F.stage&&r.stage!==F.stage) return false;
  if(F.group&&r.group!==F.group) return false;
  if(F.heat&&r.heat!==F.heat) return false;
  if(F.due&&!(nextStep(r)||{}).due) return false;
  if(F.ask&&!openQ(r)) return false;
  if(F.q){const h=[r.name,r.interest,r.phone,r.zone,r.group,r.details,
    ...(r.steps||[]).map(s=>s.t),...(r.qa||[]).map(x=>x.q+" "+x.a)].join(" ").toLowerCase();
    if(!h.includes(F.q.toLowerCase())) return false;}
  return true;
}
const RANK={hot:0,warm:1,cold:2};
const weight=r=>{const n=nextStep(r);
  return RANK[r.heat]*100-(n?.due&&n.due<=today()?40:0)-(n?20:0)-(openQ(r)?12:0)};

function rowHTML(r){
  const n=nextStep(r), late=n?.due&&n.due<=today();
  return `<button class="row ${open?.id===r.id?"on":""}" data-id="${r.id}">
    ${av(r)}
    <span style="min-width:0">
      <span class="nm" dir="auto">${esc(r.name||"بلا اسم")}</span>
      <span class="int" dir="auto">${esc(r.interest||"—")}</span>
    </span>
    <span class="pill st-${r.stage}">${ST[r.stage]||""}</span>
    <span class="stp ${n?"":"no"}" dir="auto">${n?esc(n.t):"—"}${openQ(r)?` <b style="color:var(--hot)">· سؤال</b>`:""}</span>
    <span class="due ${late?"now":""}"><bdi>${n?.due?esc(n.due):""}</bdi></span>
    <span class="ph"><bdi>${esc(r.phone||"")}</bdi></span>
    <span class="dot h-${r.heat}"></span>
  </button>`;
}
function drawList(){
  const keep=rows.filter(match).sort((a,b)=>weight(a)-weight(b));
  if(!keep.length){$("#list").innerHTML=`<p class="none">ما فماش حتى واحد هوني.</p>`;return}
  const by={}; for(const r of keep)(by[r.stage]||(by[r.stage]=[])).push(r);
  $("#list").innerHTML=STAGES.filter(([k])=>by[k]).map(([k,l])=>
    `<div class="gh"><b>${l}</b><i>${by[k].length}</i></div>${by[k].map(rowHTML).join("")}`).join("");
}
function drawRail(){
  const c=k=>rows.filter(r=>r.stage===k).length, gs=groups();
  $("#rail").innerHTML=`
    <h4>المراحل</h4>
    <button class="r" data-f="stage" data-v="" aria-pressed="${!F.stage}">الكل<span class="n">${rows.length}</span></button>
    ${STAGES.map(([k,l])=>`<button class="r" data-f="stage" data-v="${k}" aria-pressed="${F.stage===k}">${l}<span class="n">${c(k)}</span></button>`).join("")}
    ${gs.length?`<h4>المجموعات</h4>
      ${gs.map(g=>`<button class="r" data-f="group" data-v="${esc(g)}" aria-pressed="${F.group===g}">${esc(g)}<span class="n">${rows.filter(r=>r.group===g).length}</span></button>`).join("")}`:""}
    <h4>الحرارة</h4>
    ${HEATS.map(([k,l])=>`<button class="r" data-f="heat" data-v="${k}" aria-pressed="${F.heat===k}"><span class="sw h-${k}"></span>${l}<span class="n">${rows.filter(r=>r.heat===k).length}</span></button>`).join("")}
    <h4>وقتاش</h4>
    <button class="r" data-f="due" aria-pressed="${F.due}">عندهم موعد<span class="n">${rows.filter(r=>(nextStep(r)||{}).due).length}</span></button>
    <button class="r" data-f="ask" aria-pressed="${F.ask}">سؤال بلا جواب<span class="n">${rows.filter(openQ).length}</span></button>`;
}
const draw=()=>{drawRail();drawList()};

/* ══ البانّو ═══════════════════════════════════════════════════════ */
function drawPanel(){
  const r=open, p=$("#panel");
  if(!r){ p.innerHTML=""; $("#main").classList.remove("open"); return; }
  $("#main").classList.add("open");
  const steps=r.steps||[], first=steps.findIndex(s=>!s.done), pc=Math.round(doneN(r)/FLOW.length*100);
  p.innerHTML=`
  <div class="ph-head">
    <span class="avwrap ${armed==="img"?"armed":""}" id="armImg">${av(r,"xl")}
      <span class="tag">${armed==="img"?"Ctrl+V":"بدّل"}</span></span>
    <span class="grow">
      <input class="t name" id="f-name" value="${esc(r.name)}" placeholder="الاسم" dir="auto" />
      <input class="t sub" id="f-interest" value="${esc(r.interest)}" placeholder="شنوة اللوكال، شنوة يحب" dir="auto" />
    </span>
    <button class="b icon" id="close" title="سكّر">✕</button>
  </div>

  <section>
    <div class="kv">
      <span>النمرة</span><input class="t lat" id="f-phone" value="${esc(r.phone)}" placeholder="+216…" dir="ltr" />
      <span>الزون</span><input class="t" id="f-zone" value="${esc(r.zone)}" placeholder="الحومة" dir="auto" />
      <span>من وين</span><input class="t" id="f-channel" value="${esc(r.channel)}" placeholder="مسنجر…" dir="auto" />
    </div>
    <div class="trio">
      <select class="sel" id="f-stage">${STAGES.map(([k,l])=>`<option value="${k}"${r.stage===k?" selected":""}>${l}</option>`).join("")}</select>
      <input class="sel" id="f-group" value="${esc(r.group)}" placeholder="مجموعة" list="gl" dir="auto" />
      <datalist id="gl">${groups().map(g=>`<option value="${esc(g)}"></option>`).join("")}</datalist>
      <select class="sel" id="f-heat">${HEATS.map(([k,l])=>`<option value="${k}"${r.heat===k?" selected":""}>${l}</option>`).join("")}</select>
    </div>
  </section>

  <section>
    <h5>الخطوات <button class="b sm add" id="addStep">+</button></h5>
    ${steps.length?steps.map((s,i)=>`
      <div class="step ${s.done?"done":""} ${i===first?"now nowbar":""}">
        <input type="checkbox" data-step="${i}" ${s.done?"checked":""} />
        <input class="t" data-stept="${i}" value="${esc(s.t)}" placeholder="شنوة نعملو بعد؟" dir="auto" />
        <input class="d" type="date" data-stepd="${i}" value="${esc(s.due||"")}" />
        <button class="x" data-steprm="${i}">✕</button>
      </div>`).join(""):`<p style="color:var(--muted);font-size:12px;margin:0">ما فماش خطوة.</p>`}
  </section>

  <section>
    <h5>أسئلة وأجوبة <button class="b sm add" id="addQa">+</button></h5>
    ${(r.qa||[]).length?(r.qa||[]).map((x,i)=>`
      <div class="q ${x.q&&!x.a?"open":""}">
        <span class="hd">
          <input class="t" data-qaq="${i}" value="${esc(x.q)}" placeholder="شنوة سألك؟" dir="auto" />
          <button class="x" data-qarm="${i}">✕</button>
        </span>
        <textarea data-qaa="${i}" placeholder="${x.q&&!x.a?"مازال بلا جواب…":"الجواب"}" dir="auto">${esc(x.a)}</textarea>
      </div>`).join(""):`<p style="color:var(--muted);font-size:12px;margin:0">ما فماش سؤال.</p>`}
  </section>

  <section>
    <h5>الووركفلو <span class="n lat" style="margin-inline-start:auto;color:var(--muted);font-size:11px">${doneN(r)}/${FLOW.length}</span></h5>
    <div class="bar"><i style="width:${pc}%"></i></div>
    <div class="flow">${FLOW.map(([k,l])=>
      `<button data-flow="${k}" class="${r.flow?.[k]?"on":""}" title="${r.flow?.[k]?esc(r.flow[k]):"مازال"}">${l}</button>`).join("")}</div>
  </section>

  <section>
    <h5>تصاور</h5>
    <div class="shots">
      ${(r.shots||[]).map(s=>`<span class="s" data-zoom="${s.id}"><img src="${s.data}" alt="" /><button data-shotrm="${s.id}">✕</button></span>`).join("")}
      <span class="plus ${armed==="shot"?"armed":""}" id="armShot">${armed==="shot"?"Ctrl+V":"الصق<br/>تصويرة"}</span>
    </div>
  </section>

  <section>
    <h5>تفاصيل</h5>
    <textarea class="notes" id="f-details" placeholder="كل شي آخر…" dir="auto">${esc(r.details)}</textarea>
  </section>

  <div class="pfoot">
    <small>تبدّل <bdi class="lat">${esc(r.updated)}</bdi></small>
    ${r.phone?`<a class="b sm" href="https://wa.me/${esc(r.phone.replace(/[^0-9]/g,""))}" target="_blank" rel="noopener">واتساب</a>`:""}
    <button class="b sm" id="del">امسح</button>
  </div>`;
  wire();
}

function wire(){
  const r=open, p=$("#panel"), S=s=>$(s,p);
  const bind=(sel,key,re)=>{const el=S(sel);if(!el)return;
    el.addEventListener("change",async()=>{r[key]=el.value;await save(r);drawList();drawRail();if(re)drawPanel()})};
  ["name","interest","phone","zone","channel","details"].forEach(k=>bind("#f-"+k,k));
  bind("#f-stage","stage",1); bind("#f-heat","heat",1); bind("#f-group","group",1);

  S("#close").onclick=()=>{open=null;armed=false;drawPanel();drawList()};
  S("#del").onclick=async()=>{
    if(!confirm(`نمسحو «${r.name||"بلا اسم"}»؟`))return;
    await idb.del(r.id);rows=rows.filter(x=>x.id!==r.id);open=null;drawPanel();draw();toast("تمسح")};

  S("#armImg").onclick=()=>{armed=armed==="img"?false:"img";drawPanel();if(armed)toast("دوس Ctrl+V")};
  S("#armShot").onclick=()=>{armed=armed==="shot"?false:"shot";drawPanel();if(armed)toast("دوس Ctrl+V")};

  S("#addStep").onclick=async()=>{(r.steps||(r.steps=[])).push({t:"",done:false,due:""});
    await save(r);drawPanel();const i=$$("[data-stept]",p);i[i.length-1]?.focus()};
  $$("[data-step]",p).forEach(el=>el.onchange=async()=>{r.steps[+el.dataset.step].done=el.checked;await save(r);drawPanel();drawList()});
  $$("[data-stept]",p).forEach(el=>el.onchange=async()=>{r.steps[+el.dataset.stept].t=el.value;await save(r);drawList()});
  $$("[data-stepd]",p).forEach(el=>el.onchange=async()=>{r.steps[+el.dataset.stepd].due=el.value;await save(r);drawList();drawRail()});
  $$("[data-steprm]",p).forEach(el=>el.onclick=async()=>{r.steps.splice(+el.dataset.steprm,1);await save(r);drawPanel();drawList()});

  S("#addQa").onclick=async()=>{(r.qa||(r.qa=[])).push({q:"",a:""});
    await save(r);drawPanel();const i=$$("[data-qaq]",p);i[i.length-1]?.focus()};
  $$("[data-qaq]",p).forEach(el=>el.onchange=async()=>{r.qa[+el.dataset.qaq].q=el.value;await save(r);drawPanel();drawList();drawRail()});
  $$("[data-qaa]",p).forEach(el=>el.onchange=async()=>{r.qa[+el.dataset.qaa].a=el.value;await save(r);drawPanel();drawList();drawRail()});
  $$("[data-qarm]",p).forEach(el=>el.onclick=async()=>{r.qa.splice(+el.dataset.qarm,1);await save(r);drawPanel();drawList();drawRail()});

  $$("[data-flow]",p).forEach(el=>el.onclick=async()=>{r.flow||(r.flow={});
    el.classList.contains("on")?delete r.flow[el.dataset.flow]:r.flow[el.dataset.flow]=today();
    await save(r);drawPanel();drawList()});

  $$("[data-shotrm]",p).forEach(el=>el.onclick=async e=>{e.stopPropagation();
    r.shots=r.shots.filter(s=>s.id!==el.dataset.shotrm);await save(r);drawPanel();drawList()});
  $$("[data-zoom]",p).forEach(el=>el.onclick=()=>{
    const s=r.shots.find(x=>x.id===el.dataset.zoom);if(!s)return;
    const b=document.createElement("div");b.className="zoom";b.innerHTML=`<img src="${s.data}" alt="" />`;
    b.onclick=()=>b.remove();document.body.appendChild(b)});
}

/* ══ الربط ═════════════════════════════════════════════════════════ */
$("#q").addEventListener("input",e=>{F.q=e.target.value.trim();drawList()});
$("#rail").addEventListener("click",e=>{
  const b=e.target.closest(".r");if(!b)return;
  const f=b.dataset.f,v=b.dataset.v;
  if(f==="due"||f==="ask") F[f]=!F[f];
  else F[f]=(v===""||F[f]===v)?null:v;
  draw()});
$("#list").addEventListener("click",e=>{
  const b=e.target.closest(".row");if(!b)return;
  open=rows.find(x=>x.id===b.dataset.id)||null;armed=false;drawPanel();drawList()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&open){open=null;armed=false;drawPanel();drawList()}});

$("#add").onclick=async()=>{const r=blank();await save(r);open=r;draw();drawPanel();$("#f-name",$("#panel"))?.focus()};
$("#exp").onclick=()=>{
  const b=new Blob([JSON.stringify({v:1,at:new Date().toISOString(),clients:rows},null,1)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=`gunmade-${today()}.json`;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast("تصدّر")};
$("#imp").onclick=()=>$("#file").click();
$("#file").onchange=async e=>{
  const f=e.target.files?.[0];if(!f)return;
  try{const d=JSON.parse(await f.text());const l=Array.isArray(d)?d:d.clients;
    if(!Array.isArray(l))throw 0;
    for(const c of l)await idb.put({...blank(),...c,id:c.id||uid()});
    rows=await idb.all();draw();toast(`تزادو ${l.length}`)}
  catch{toast("الفيشي ما تقراش")}
  e.target.value=""};

/* أول مرّة باسم Gunmade: نجيبو اللي كان مسجّل بالاسم القديم، وبعد الـseed */
async function carryOver(){
  return new Promise(ok=>{
    let done=false; const fin=v=>{if(!done){done=true;ok(v||[])}};
    setTimeout(()=>fin([]),1500);
    let r; try{ r=indexedDB.open(OLD_DB) }catch{ return fin([]) }
    r.onerror=()=>fin([]);
    r.onupgradeneeded=()=>{ try{r.transaction.abort()}catch{} fin([]) };  /* ما كانتش موجودة */
    r.onsuccess=()=>{ const d=r.result;
      if(!d.objectStoreNames.contains(STORE)){ d.close(); return fin([]) }
      const g=d.transaction(STORE).objectStore(STORE).getAll();
      g.onsuccess=()=>{ d.close(); fin(g.result) };
      g.onerror=()=>{ d.close(); fin([]) };
    };
  });
}

(async()=>{
  await idb.open(); rows=await idb.all();
  if(!rows.length){
    const carried=await carryOver();
    if(carried.length){ for(const c of carried) await idb.put(c); rows=await idb.all();
      toast(`تنقلو ${rows.length} من الأداة القديمة`); }
  }
  if(!rows.length&&Array.isArray(window.SEED)&&window.SEED.length){
    for(const c of window.SEED) await idb.put({...blank(),...c});
    rows=await idb.all(); toast(`تزادو ${rows.length} من القدم`);
  }
  draw();
})();
</script>
