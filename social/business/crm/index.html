<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>اليوم · Pointili CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="crm.css" />
<style>
  /* الصفحة هاذي ما فيها كان سؤال واحد: شنوة نعمل تو ؟ */
  .hero { background: var(--sheet); border-bottom: 1px solid var(--line); padding: 20px 18px 22px; }
  .hero .in { max-width: 1120px; margin: 0 auto; }
  .hero h1 { margin: 0; font-size: 27px; font-weight: 700; color: var(--ink); letter-spacing: -.02em; }
  .hero p { margin: 6px 0 0; font-size: 14px; color: var(--muted); max-width: 66ch; }
  .hero b { color: var(--hot); }
  .hero a { color: var(--brand); }
  .done { background: var(--good-soft); border: 1px solid var(--good-line); color: var(--good);
          border-radius: 14px; padding: 16px 18px; font-size: 14.5px; font-weight: 600; }
</style>
</head>
<body>

<nav class="nav">
  <span class="brand">Pointili CRM</span>
  <span class="links"></span>
  <span class="end">
    <button type="button" class="ghost" id="reset" title="يرجّع كل حاجة بدّلتها هوني">امسح تبديلاتي</button>
  </span>
</nav>

<div class="hero"><div class="in">
  <h1>شنوة نعمل اليوم</h1>
  <p id="lede"></p>
</div></div>

<div class="page" id="page"></div>

<script src="data.js"></script>
<script src="crm.js"></script>
<script>
"use strict";

/** صف واحد، فيه كل شنوة تحتاجو باش تقرّر في ثانية */
function rowHTML(l, hi) {
  return `<div class="row ${hi ? "hi" : ""}">
      ${avHTML(l)}
      <div class="who">
        <div class="nm ${lat(l.name)}" dir="auto">
          <span class="dot ${l.heat}" title="${HEAT[l.heat]}"></span>${esc(l.name)}
        </div>
        <div class="sub">${esc(l.business || "اللوكال مازال ما تقالش")}${l.zone ? " · " + esc(l.zone) : ""} · ${stageOf(l.stage).label} · ${dayWord(daysSince(l.last))}</div>
        ${l.next ? `<p class="act">${esc(l.next)}</p>` : ""}
      </div>
      <div class="side">
        ${l.due === "today" ? `<span class="tag d1">اليوم</span>` : ""}
        ${l.due === "tomorrow" ? `<span class="tag d2">غدوة</span>` : ""}
        ${l.phone ? `<span class="tag d1 lat" dir="ltr">☎ ${esc(l.phone)}</span>` : ""}
        <span class="tag ch">${CH[l.channel]}</span>
        <button type="button" class="mini" data-answered="${l.id}">جاوبتو ✓</button>
        <a class="mini" href="board.html?id=${encodeURIComponent(l.id)}" style="text-decoration:none">التفاصيل</a>
      </div>
    </div>`;
}

const block = (title, hint, list, cls, hi) =>
  list.length
    ? `<h2 class="sec ${cls}">${title} <b>${list.length}</b> <em>${hint}</em></h2>
       <div class="rows">${list.map((l) => rowHTML(l, hi)).join("")}</div>`
    : "";

function draw() {
  const rows = all();
  const mine = rows.filter((l) => l.turn === "us" && l.stage !== "lost" && !l.unread).sort(byWeight);
  const later = rows.filter((l) => l.turn !== "us" && l.due && !l.unread).sort(byWeight);
  const unread = rows.filter((l) => l.unread).sort(byWeight);

  $("lede").innerHTML = mine.length
    ? `فمّة <b>${mine.length}</b> ناس مستنّيين فيك انت، موش انت مستنّي فيهم. هاذوما قبل كل شي.`
    : `ما فماش حتّى واحد مستنّي فيك. شوف <a href="silent.html">ساكت</a> كان تحب تحرّك حد.`;

  $("page").innerHTML =
    (mine.length
      ? block("دورك انت", "آخر كلمة كانت منّهم، ولا وعدتهم بحاجة", mine, "", true)
      : `<div class="done">كل شي مجاوب. ما عندك حتّى دور اليوم 👌</div>`) +
    block("مواعيد", "متفق معاهم، مازال ما حانش وقتهم", later, "warmc", false) +
    block("ما قريناهم", "حلّهم فمسنجر وقول لكلود شنوة فيهم — حالتهم تخمين موش خبر", unread, "coldc", false);

  for (const b of document.querySelectorAll("[data-answered]")) {
    b.addEventListener("click", () => {
      const id = b.dataset.answered;
      edits[id] = { ...(edits[id] || {}), turn: "them", due: null };
      persist();
      draw();
      drawNav("index.html");
    });
  }
}

$("reset").addEventListener("click", () => {
  if (!confirm("تحب تمسح كل حاجة بدّلتها هوني ؟")) return;
  edits = {}; persist(); draw(); drawNav("index.html");
});

drawNav("index.html");
draw();
</script>
</body>
</html>
