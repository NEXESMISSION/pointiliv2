<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#4536F0" />
    <title>You're offline · Pointidi</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f6f7fb;
        color: #0f1222;
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
      }
      main {
        width: 100%;
        max-width: 380px;
        background: #fff;
        border: 1px solid #e8eaf2;
        border-radius: 28px;
        box-shadow: 0 1px 2px rgb(16 24 40 / 0.04), 0 16px 40px -12px rgb(16 24 40 / 0.18);
        padding: 36px 24px 28px;
        text-align: center;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-weight: 800;
        font-size: 20px;
        letter-spacing: -0.02em;
      }
      .badge {
        width: 72px;
        height: 72px;
        margin: 28px auto 18px;
        border-radius: 24px;
        background: #f0f0ff;
        color: #4536f0;
        display: grid;
        place-items: center;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 24px;
        line-height: 1.2;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 24px;
        color: #6b7185;
        font-size: 15px;
        line-height: 1.55;
      }
      button {
        appearance: none;
        border: 0;
        width: 100%;
        height: 52px;
        border-radius: 16px;
        background: #4536f0;
        color: #fff;
        font: inherit;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 10px 24px -8px rgb(69 54 240 / 0.55);
        transition: transform 0.1s ease, background 0.15s ease;
      }
      button:hover {
        background: #3a2bd1;
      }
      button:active {
        transform: scale(0.98);
      }
      button:focus-visible {
        outline: 2px solid #5f53f5;
        outline-offset: 3px;
      }
      small {
        display: block;
        margin-top: 16px;
        color: #9aa0b3;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="brand">
        <svg width="28" height="28" viewBox="0 0 48 48" aria-hidden="true">
          <path d="M24 3C14.6 3 7 10.4 7 19.6 7 31.6 21.2 43.3 22.6 44.5a2.2 2.2 0 0 0 2.8 0C26.8 43.3 41 31.6 41 19.6 41 10.4 33.4 3 24 3Z" fill="#4536F0" />
          <circle cx="24" cy="19.5" r="9.5" fill="#fff" />
          <path d="M20.3 15.2h4.6a4.4 4.4 0 0 1 0 8.8h-2.2v3.2h-2.4v-12Zm2.4 2.2v4.4h2.1a2.2 2.2 0 0 0 0-4.4h-2.1Z" fill="#4536F0" />
        </svg>
        Pointidi
      </span>
      <div class="badge" aria-hidden="true">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h.01" />
          <path d="M8.5 16.43a5 5 0 0 1 7 0" />
          <path d="M5 12.86a10 10 0 0 1 5.17-2.69" />
          <path d="M19 12.86a10 10 0 0 0-2-1.39" />
          <path d="M2 8.82a15 15 0 0 1 4.18-2.64" />
          <path d="M22 8.82a15 15 0 0 0-11.29-3.76" />
          <path d="m2 2 20 20" />
        </svg>
      </div>
      <h1>You're offline</h1>
      <p>Pointidi needs a connection to show your live stamps. Check your Wi-Fi or mobile data, then try again. Your stamps are safe.</p>
      <button type="button" onclick="location.reload()">Try again</button>
      <small>We'll reload automatically when you're back online.</small>
    </main>
    <script>
      window.addEventListener("online", function () {
        location.reload();
      });
    </script>
  </body>
</html>
