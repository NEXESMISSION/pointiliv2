<!doctype html>
<html lang="ar-TN" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#6535E0" />
    <title>إنت أوفلاين · Pointili</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f6f7fb;
        color: #0f1222;
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
      }
      main {
        width: 100%;
        max-width: 380px;
        background: #fff;
        border: 1px solid #e8eaf2;
        border-radius: 28px;
        box-shadow: 0 1px 2px rgb(16 24 40 / 0.04), 0 16px 40px -12px rgb(16 24 40 / 0.18);
        padding: 36px 24px 28px;
        text-align: center;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-weight: 800;
        font-size: 20px;
        letter-spacing: -0.02em;
      }
      .badge {
        width: 72px;
        height: 72px;
        margin: 28px auto 18px;
        border-radius: 24px;
        background: #f4f0ff;
        color: #6535e0;
        display: grid;
        place-items: center;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 24px;
        line-height: 1.2;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 24px;
        color: #6b7185;
        font-size: 15px;
        line-height: 1.55;
      }
      button {
        appearance: none;
        border: 0;
        width: 100%;
        height: 52px;
        border-radius: 16px;
        background: #6535e0;
        color: #fff;
        font: inherit;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 10px 24px -8px rgb(101 53 224 / 0.55);
        transition: transform 0.1s ease, background 0.15s ease;
      }
      button:hover {
        background: #5328c4;
      }
      button:active {
        transform: scale(0.98);
      }
      button:focus-visible {
        outline: 2px solid #7c50ee;
        outline-offset: 3px;
      }
      small {
        display: block;
        margin-top: 16px;
        color: #9aa0b3;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="brand">
        <img src="/brand-mark.svg" width="34" height="25" alt="" />
        Pointili
      </span>
      <div class="badge" aria-hidden="true">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h.01" />
          <path d="M8.5 16.43a5 5 0 0 1 7 0" />
          <path d="M5 12.86a10 10 0 0 1 5.17-2.69" />
          <path d="M19 12.86a10 10 0 0 0-2-1.39" />
          <path d="M2 8.82a15 15 0 0 1 4.18-2.64" />
          <path d="M22 8.82a15 15 0 0 0-11.29-3.76" />
          <path d="m2 2 20 20" />
        </svg>
      </div>
      <h1>إنت أوفلاين</h1>
      <p>Pointili يلزمو كونيكسيون باش يورّي التامبونات متاعك. شوف الويفي ولا الداتا متاعك وعاود جرّب. التامبونات متاعك في أمان.</p>
      <button type="button" onclick="location.reload()">عاود جرّب</button>
      <small>كي ترجع أونلاين نعاودو نحمّلو وحدنا.</small>
    </main>
    <script>
      window.addEventListener("online", function () {
        location.reload();
      });
    </script>
  </body>
</html>
