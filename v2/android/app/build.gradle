plugins {
    id 'com.android.application'
}

android {
    namespace 'online.pointili.app'
    compileSdk 36

    defaultConfig {
        // the same app as the first one (a Chrome TWA, version 1): installed over it, an update
        applicationId 'online.pointili.app'
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName '2.0.0'
    }

    signingConfigs {
        release {
            // Pointili's own key (never in git): the same one, or phones refuse the update
            storeFile file(System.getenv('POINTILI_KEYSTORE') ?: 'C:/Users/ayoub/pointili-android/keystore/pointili.keystore')
            storePassword System.getenv('POINTILI_KEYSTORE_PASSWORD')
            keyAlias 'pointili'
            keyPassword System.getenv('POINTILI_KEYSTORE_PASSWORD')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
